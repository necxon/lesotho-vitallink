# Load balancer for the OpenSRP nodes.
#
# Same shape as config/fhir-proxy/nginx.conf, and the same two nginx traps apply:
#   - a killed container becomes UNROUTABLE rather than refusing connections, so
#     without a short proxy_connect_timeout nginx waits its 60s default before
#     trying the other node. That is far longer than any caller will wait, and it
#     makes working failover look like an outage.
#   - upstream names resolve once at config load, so a recreated container is
#     addressed at its old IP forever. The 30s reload in the compose command
#     re-resolves them; the per-node health checks below use a variable so they
#     always see the truth.
upstream opensrp_backends {
    server opensrp-server:8080   max_fails=2 fail_timeout=10s;
    server opensrp-server-2:8080 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    proxy_connect_timeout 3s;
    proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 15s;

    location / {
        proxy_pass http://opensrp_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # Per-node health for the Administrator Portal. Pinned to one node each, so
    # the portal reports that node's state rather than whichever the balancer
    # happened to choose - which is exactly the wrong answer when you are trying
    # to find out which node died.
    location = /backend/1/health {
        set $o1 "opensrp-server:8080";
        proxy_pass http://$o1/opensrp/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
    }

    location = /backend/2/health {
        set $o2 "opensrp-server-2:8080";
        proxy_pass http://$o2/opensrp/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
    }
}
