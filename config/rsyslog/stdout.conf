# Forward all syslog messages to container stdout so `docker logs -f openlmis-log` works.
# rsyslog opens /dev/stdout which resolves via /proc/self/fd/1 to the Docker log pipe.
template(name="DockerStdout" type="string" string="%TIMESTAMP% %HOSTNAME% %syslogtag%%msg%\n")
*.* action(type="omfile" file="/dev/stdout" template="DockerStdout")
