# HAPI FHIR backends. nginx open source has passive health checks only: a node
# is taken out of rotation after max_fails connection/timeout errors and retried
# after fail_timeout. proxy_next_upstream below then retries the request on the
# other node, so a dying backend costs a retry rather than an error to the phone.
#
# Both nodes share the hapi_fhir database, so either can serve any request.
upstream hapi_backends {
    server hapi-fhir:8080   max_fails=2 fail_timeout=10s;
    server hapi-fhir-2:8080 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;

    # Docker embedded DNS. Required for the variable-based proxy_pass below,
    # and the short validity keeps a restarted backend from being probed at a
    # stale address for long.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # Retry the other backend when one refuses, times out or 5xxs. non_idempotent
    # lets POSTs retry too: the app's sync bundles are the traffic that matters,
    # and a bundle that never reached HAPI is safe to resend.
    proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 15s;

    # This is what makes failover fast enough to be invisible. A killed
    # container does not refuse connections, it becomes unroutable, and nginx
    # would sit on the default 60s connect timeout before trying the other
    # node - long enough for the phone to give up first. 3s is far above any
    # healthy connect on the docker network and far below the app's patience.
    proxy_connect_timeout 3s;

    # /PractitionerDetail?keycloak-uuid=<uuid>
    # NetworkModule.kt strips "fhir/" from CUSTOM_ENDPOINTS, so the app hits
    # /PractitionerDetail (NOT /fhir/PractitionerDetail). The mediator builds the
    # bundle dynamically from FHIR for ANY user (real practitioner + org + care
    # team + location), replacing the old static practitioner_details_*.json stubs.
    location /PractitionerDetail {
        proxy_pass http://bkm-mediator:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # QuestionnaireResponse POSTs are mirrored to OpenHIM so the app's
    # stock form submissions trigger the mediator fan-out to OpenLMIS/DHIS2.
    # The mirror fires asynchronously; the primary response comes from HAPI FHIR.
    location ~ ^/fhir/QuestionnaireResponse {
        mirror /openhim-qr-mirror;
        mirror_request_body on;
        proxy_pass http://hapi_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /openhim-qr-mirror {
        internal;
        # Skip reads — only forward writes (POST/PUT) to OpenHIM
        if ($request_method !~ ^(POST|PUT)$) { return 204; }
        proxy_method POST;
        proxy_pass http://openhim-core:5001/fhir/QuestionnaireResponse;
        proxy_pass_request_headers on;
    }

    # App sync uploads are transaction bundles posted to /fhir/.
    # Mirror each bundle to the mediator's bundle-sync endpoint so it can
    # extract and fan out any stock QuestionnaireResponse entries.
    location = /fhir/ {
        mirror /bundle-sync-mirror;
        mirror_request_body on;
        proxy_pass http://hapi_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /bundle-sync-mirror {
        internal;
        proxy_method POST;
        proxy_pass http://bkm-mediator:3000/fhir/bundle-sync;
        proxy_pass_request_headers on;
    }

    # Everything else (including /fhir/*) proxies to HAPI FHIR
    location / {
        proxy_pass http://hapi_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Per-backend health, for the Administrator Portal cluster page.
    # Each location pins ONE node so the portal sees that node's real state
    # rather than whichever the load balancer picked.
    #
    # These go through a VARIABLE on purpose. With a literal hostname nginx
    # resolves it once at config load and caches the IP forever, so after a
    # backend container restarts on a new IP the check keeps probing the old
    # address and reports a healthy node as dead. A variable forces a fresh
    # lookup against Docker's embedded DNS on every request.
    location = /backend/1/health {
        set $b1 "hapi-fhir:8080";
        proxy_pass http://$b1/fhir/metadata?_summary=true;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
    }

    location = /backend/2/health {
        set $b2 "hapi-fhir-2:8080";
        proxy_pass http://$b2/fhir/metadata?_summary=true;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
    }
}
