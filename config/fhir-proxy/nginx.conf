server {
    listen 80;

    # /PractitionerDetail?keycloak-uuid=<uuid>
    # NetworkModule.kt strips "fhir/" from CUSTOM_ENDPOINTS, so the app hits
    # /PractitionerDetail (NOT /fhir/PractitionerDetail). The mediator builds the
    # bundle dynamically from FHIR for ANY user (real practitioner + org + care
    # team + location), replacing the old static practitioner_details_*.json stubs.
    location /PractitionerDetail {
        proxy_pass http://bkm-mediator:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # QuestionnaireResponse POSTs are mirrored to OpenHIM so the app's
    # stock form submissions trigger the mediator fan-out to OpenLMIS/DHIS2.
    # The mirror fires asynchronously; the primary response comes from HAPI FHIR.
    location ~ ^/fhir/QuestionnaireResponse {
        mirror /openhim-qr-mirror;
        mirror_request_body on;
        proxy_pass http://hapi-fhir:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /openhim-qr-mirror {
        internal;
        # Skip reads — only forward writes (POST/PUT) to OpenHIM
        if ($request_method !~ ^(POST|PUT)$) { return 204; }
        proxy_method POST;
        proxy_pass http://openhim-core:5001/fhir/QuestionnaireResponse;
        proxy_pass_request_headers on;
    }

    # App sync uploads are transaction bundles posted to /fhir/.
    # Mirror each bundle to the mediator's bundle-sync endpoint so it can
    # extract and fan out any stock QuestionnaireResponse entries.
    location = /fhir/ {
        mirror /bundle-sync-mirror;
        mirror_request_body on;
        proxy_pass http://hapi-fhir:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /bundle-sync-mirror {
        internal;
        proxy_method POST;
        proxy_pass http://bkm-mediator:3000/fhir/bundle-sync;
        proxy_pass_request_headers on;
    }

    # Everything else (including /fhir/*) proxies to HAPI FHIR
    location / {
        proxy_pass http://hapi-fhir:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
