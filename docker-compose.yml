version: '3.8'

services:
  # --- SHARED DATABASE LAYER ---
  db-postgres:
    image: postgis/postgis:14-3.2
    container_name: health-db-postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=postgres
      - POSTGRES_HOST_AUTH_METHOD=md5
    networks:
      - health-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/initdb:/docker-entrypoint-initdb.d:ro

  db-mongo:
    image: mongo:4.4
    container_name: openhim-mongo
    networks:
      - health-net
    volumes:
      - mongo-data:/data/db

  # --- INTEROPERABILITY LAYER (OpenHIM) ---
  openhim-core:
    image: jembi/openhim-core:latest
    container_name: openhim-core
    ports:
      - "5000:5000"
      - "5001:5001"
      - "8080:8080"
    environment:
      - mongo_url=mongodb://db-mongo:27017/openhim
    depends_on:
      - db-mongo
    networks:
      - health-net

  openhim-console:
    image: jembi/openhim-console:latest
    container_name: openhim-console
    ports:
      - "9000:80"
    volumes:
      - ./config/openhim-console/openlmis-theme.css:/usr/share/nginx/html/openlmis-theme.css:ro
    networks:
      - health-net

  # --- MONITORING LAYER ---
