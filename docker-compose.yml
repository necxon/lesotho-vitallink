  # promtail:
  #   image: grafana/promtail:latest
  #   container_name: promtail
  #   volumes:
  #     - /var/log:/var/log:ro
  #     - /var/lib/docker/containers:/var/lib/docker/containers:ro
  #     - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
  #   command: -config.file=/etc/promtail/config.yml
  #   networks:
  #     - health-net
  #   restart: always

  # cadvisor:
  #   image: gcr.io/cadvisor/cadvisor:latest
  #   container_name: cadvisor
  #   volumes:
  #     - /:/rootfs:ro
  #     - /var/run:/var/run:ro
  #     - /sys:/sys:ro
  #     - /var/lib/docker/:/var/lib/docker:ro
  #     - /dev/disk/:/dev/disk:ro
  #   networks:
  #     - health-net
  #   restart: always

  # postgres-exporter:
  #   image: prometheuscommunity/postgres-exporter
  #   container_name: postgres-exporter
  #   environment:
  #     - DATA_SOURCE_NAME=postgresql://admin:password123@db-postgres:5432/postgres?sslmode=disable
  #   networks:
  #     - health-net
  #   restart: always

  # --- BKM MEDIATOR ---
  bkm-mediator:
    build: ./mediator
    container_name: bkm-mediator
    environment:
      - OPENHIM_URL=https://openhim-core:8080
      - OPENHIM_USER=root@openhim.org
      - OPENHIM_PASS=openhim-password
      - OPENSRP_URL=http://opensrp-server:8080
      - OPENSRP_CLIENT_ID=bkm-mediator
      - OPENSRP_CLIENT_SECRET=mediator-secret
      - KEYCLOAK_URL=http://keycloak:8080
      - DHIS2_URL=http://dhis2-web:8080
      - DHIS2_USER=admin
      - DHIS2_PASS=district
      - OPENLMIS_AUTH_URL=http://openlmis-auth:8080
      - OPENLMIS_MGMT_URL=http://openlmis-stockmanagement:8080
      - OPENLMIS_USER=admin
      - OPENLMIS_PASS=password
      - OPENLMIS_CLIENT_ID=user-client
      - OPENLMIS_CLIENT_SECRET=changeme
      - OPENLMIS_PROGRAM_ID=31ef5fd8-cef9-4ec0-8304-3018d2cf6c9c
      - OPENLMIS_REASON_ID=b5c27da7-bdda-4790-925a-9484c5dfb594
      - OPENLMIS_LOT_ID=ffffffff-0000-0000-0000-000000000001
      - OPENLMIS_FACILITY_ID=28de536f-b826-4eeb-a3c4-d65221a1120d
      - OPENLMIS_ORDERABLE_ID=3be1d20f-6aa9-4e52-864f-4fa04aa02056
      - DHIS2_DE_STOCK_RECEIVED=StckRcvdAL1
      - DHIS2_DE_STOCK_ON_HAND=StockOnHnd1
      - HAPI_FHIR_URL=http://hapi-fhir:8080/fhir
      - POLL_INTERVAL_MS=60000
      - OPENLMIS_RECEIPT_REASON_ID=313f2f5f-0c22-4626-8c49-3554ef763de3
      - RECEIPT_TYPE_CODE=RECEIPT
      - LOG_LEVEL=debug
      - NOTIFY_SMS_ENABLED=true
      - NOTIFY_PUSH_ENABLED=true
      - NOTIFY_ON_DISPENSE=true
      - NOTIFY_ON_LOW_STOCK=true
      - NOTIFY_ON_RECEIPT=true
      - NOTIFY_LOW_STOCK_THRESHOLD=20
      - NOTIFY_SMS_URL=http://notification-sink:3001/sms
      - NOTIFY_PUSH_URL=http://notification-sink:3001/push
      - NOTIFY_PUSH_API_KEY=sandbox-key
      - NOTIFY_EMAIL_ENABLED=true
      - NOTIFY_EMAIL_URL=http://notification-sink:3001/email
      - NOTIFY_EMAIL_FROM=mediator@lesotho.health
      - NOTIFY_SMS_THROTTLE_MS=300000
      - NOTIFY_PUSH_THROTTLE_MS=60000
      - NOTIFY_EMAIL_THROTTLE_MS=600000
    depends_on:
      - openhim-core
      - opensrp-server
      - keycloak
      - openlmis-stockmanagement
      - notification-sink
    networks:
      - health-net

  # --- DHIS2 ---
  dhis2-web:
    image: dhis2/core:2.40
    container_name: dhis2-web
    ports:
      - "8081:8080"
    volumes:
      - ./config/dhis.conf:/opt/dhis2/dhis.conf:ro
    depends_on:
      db-postgres:
        condition: service_healthy
    networks:
      - health-net

  # --- KEYCLOAK ---
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./config/keycloak/opensrp-realm.json:/opt/keycloak/data/import/opensrp-realm.json:ro
    ports:
      - "8083:8080"
    networks:
      - health-net

  # --- OPENSRP SERVER ---
  opensrp-server:
    image: opensrp/opensrp-server-web:latest
    container_name: opensrp-server
    ports:
      - "9900:8080"
    volumes:
      - ./config/opensrp/context.xml:/usr/local/tomcat/conf/context.xml:ro
      - ./config/opensrp/keycloak.json:/usr/local/tomcat/webapps/opensrp/WEB-INF/keycloak.json:ro
    depends_on:
      db-postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - health-net

  # --- OPENLMIS MICROSERVICES ---
  consul:
    image: hashicorp/consul:1.9
    container_name: consul
    command: ["consul", "agent", "-dev", "-client", "0.0.0.0"]
    networks:
      - health-net

  log:
    image: openlmis/rsyslog:latest
    container_name: openlmis-log
    volumes:
      - ./config/rsyslog/stdout.conf:/etc/rsyslog.d/stdout.conf:ro
    networks:
      - health-net

  openlmis-rabbitmq:
    image: rabbitmq:3.8-management
    container_name: openlmis-rabbitmq
    networks:
      - health-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  openlmis-auth:
    image: openlmis/auth:latest
    container_name: openlmis-auth
    environment:
      - DATABASE_URL=jdbc:postgresql://db-postgres:5432/openlmis_auth
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - BASE_URL=http://openlmis-nginx
      - spring.rabbitmq.host=openlmis-rabbitmq
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQL94Dialect
      - JAVA_OPTS=-Xmx512m
    depends_on:
      db-postgres:
        condition: service_healthy
      openlmis-rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started
      log:
        condition: service_started
    networks:
      - health-net

  openlmis-referencedata:
    image: openlmis/referencedata:latest
    container_name: openlmis-referencedata
    environment:
      - DATABASE_URL=jdbc:postgresql://db-postgres:5432/openlmis_referencedata
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - BASE_URL=http://openlmis-nginx
      - spring.rabbitmq.host=openlmis-rabbitmq
      - JAVA_OPTS=-Xmx512m
    depends_on:
      - db-postgres
      - openlmis-rabbitmq
      - openlmis-auth
    networks:
      - health-net

  openlmis-stockmanagement:
    image: openlmis/stockmanagement:latest
    container_name: openlmis-stockmanagement
    environment:
      - DATABASE_URL=jdbc:postgresql://db-postgres:5432/openlmis_stockmanagement
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - BASE_URL=http://openlmis-nginx
      - spring.rabbitmq.host=openlmis-rabbitmq
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQL94Dialect
      - JAVA_OPTS=-Xmx512m
    depends_on:
      - db-postgres
      - openlmis-rabbitmq
      - openlmis-auth
      - openlmis-referencedata
    networks:
      - health-net

  openlmis-nginx:
    image: openlmis/nginx:latest
    container_name: openlmis-nginx
    ports:
      - "8082:80"
    environment:
      - VIRTUAL_HOST=localhost
      - AUTH_SERVICE_URL=http://openlmis-auth:8080
      - REFERENCEDATA_SERVICE_URL=http://openlmis-referencedata:8080
      - STOCKMANAGEMENT_SERVICE_URL=http://openlmis-stockmanagement:8080
      - UI_SERVICE_URL=http://openlmis-ui:80
    depends_on:
      - openlmis-auth
      - openlmis-referencedata
      - openlmis-stockmanagement
    networks:
      - health-net

  openlmis-ui:
    image: openlmis/reference-ui:5.2.13
    container_name: openlmis-ui
    environment:
      - BASE_URL=http://localhost:8082
    networks:
      - health-net

  # --- HAPI FHIR & OPENSRP WEB ---
  hapi-fhir:
    image: hapiproject/hapi:v7.2.0
    container_name: hapi-fhir
    ports:
      - "8079:8080"
    environment:
      - hapi.fhir.fhir_version=R4
    networks:
      - health-net

  opensrp-web:
    image: opensrp/web:latest
    container_name: opensrp-web
    ports:
      - "9901:3000"
    environment:
      - EXPRESS_OPENSRP_CLIENT_ID=opensrp-web
      - EXPRESS_OPENSRP_ACCESS_TOKEN_URL=http://keycloak:8080/realms/opensrp/protocol/openid-connect/token
      - REACT_APP_FHIR_API_BASE_URL=http://localhost:8079/fhir
    depends_on:
      - keycloak
      - hapi-fhir
    networks:
      - health-net

  # --- UTILITIES & SINKS ---
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "8025:8025"
    networks:
      - health-net

  notification-sink:
    build: ./notification-sink
    container_name: notification-sink
    ports:
      - "8086:3001"
    depends_on:
      - mailhog
    networks:
      - health-net

networks:
  health-net:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  # prometheus-data:
  # grafana-data:
  # loki-data:
  opensrp-web-sessions: