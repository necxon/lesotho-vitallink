server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve upstream hostnames on each request so container IP changes
    # (e.g. after bkm-mediator restart) don't cause 502s until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location /mediator-api/ {
        set $mediator bkm-mediator;
        rewrite ^/mediator-api/(.*) /$1 break;
        proxy_pass http://$mediator:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /lmis-token {
        set $mediator bkm-mediator;
        proxy_pass http://$mediator:3000/lmis-token;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location /keycloak-api/ {
        set $kc keycloak;
        rewrite ^/keycloak-api/(.*) /$1 break;
        proxy_pass http://$kc:8080;
        proxy_set_header Host keycloak:8080;
        proxy_read_timeout 30s;
    }

    location /lmis-api/ {
        set $lmis openlmis-ref-distro-nginx-1;
        rewrite ^/lmis-api/(.*) /$1 break;
        proxy_pass http://$lmis:80;
        proxy_set_header Host openlmis-ref-distro-nginx-1;
        proxy_read_timeout 30s;
    }

    location /fhir-api/ {
        set $fhir fhir-proxy;
        rewrite ^/fhir-api/(.*) /$1 break;
        proxy_pass http://$fhir:80;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        client_max_body_size 50m;
    }

    location /openhim-api/ {
        set $openhim openhim-core;
        rewrite ^/openhim-api/(.*) /$1 break;
        proxy_pass http://$openhim:5001;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /dhis2-api/ {
        set $dhis2 dhis2-web;
        rewrite ^/dhis2-api/(.*) /$1 break;
        proxy_pass http://$dhis2:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Health probes for the Services page.
    #
    # These MUST exist. Without them /ping/* falls through to the SPA below,
    # which answers 200 for any path - so every service showed a green dot even
    # when it was stopped, including services that do not exist. A status light
    # that is always green is worse than no status light.
    #
    # HEAD with a short timeout; any response under 500 counts as reachable, so
    # a 302 to a login page is a healthy answer.
    location = /ping/superset/     { proxy_pass http://bkm-superset:8088/health;        proxy_connect_timeout 3s; proxy_read_timeout 5s; }
    location = /ping/opensrp-web/  { proxy_pass http://opensrp-web:3000/;               proxy_connect_timeout 3s; proxy_read_timeout 5s; }
    location = /ping/openhim/      { proxy_pass http://openhim-console:80/;             proxy_connect_timeout 3s; proxy_read_timeout 5s; }
    location = /ping/keycloak/     { proxy_pass http://keycloak:8080/auth/realms/opensrp; proxy_connect_timeout 3s; proxy_read_timeout 5s; }
    location = /ping/fhir/         { proxy_pass http://fhir-proxy:80/fhir/metadata;     proxy_connect_timeout 3s; proxy_read_timeout 8s; }
    location = /ping/dhis2/        { proxy_pass http://dhis2-web:8080/;                 proxy_connect_timeout 3s; proxy_read_timeout 8s; }
    location = /ping/openlmis/     { proxy_pass http://nginx:80/;                       proxy_connect_timeout 3s; proxy_read_timeout 5s; }
    location = /ping/grafana/      { proxy_pass http://grafana:3000/api/health;         proxy_connect_timeout 3s; proxy_read_timeout 5s; }
    location = /ping/prometheus/   { proxy_pass http://prometheus:9090/-/healthy;       proxy_connect_timeout 3s; proxy_read_timeout 5s; }
    location = /ping/mailhog/      { proxy_pass http://mailhog:8025/;                   proxy_connect_timeout 3s; proxy_read_timeout 5s; }

    # Anything else under /ping/ is a service with no probe wired up. Answer 501
    # rather than letting the SPA fall through and fake a healthy 200.
    location /ping/ { return 501; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
}
