server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve upstream hostnames on each request so container IP changes
    # (e.g. after bkm-mediator restart) don't cause 502s until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location /mediator-api/ {
        set $mediator bkm-mediator;
        rewrite ^/mediator-api/(.*) /$1 break;
        proxy_pass http://$mediator:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /lmis-token {
        set $mediator bkm-mediator;
        proxy_pass http://$mediator:3000/lmis-token;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location /keycloak-api/ {
        set $kc keycloak;
        rewrite ^/keycloak-api/(.*) /$1 break;
        proxy_pass http://$kc:8080;
        proxy_set_header Host keycloak:8080;
        proxy_read_timeout 30s;
    }

    location /lmis-api/ {
        set $lmis openlmis-ref-distro-nginx-1;
        rewrite ^/lmis-api/(.*) /$1 break;
        proxy_pass http://$lmis:80;
        proxy_set_header Host openlmis-ref-distro-nginx-1;
        proxy_read_timeout 30s;
    }

    location /fhir-api/ {
        set $fhir fhir-proxy;
        rewrite ^/fhir-api/(.*) /$1 break;
        proxy_pass http://$fhir:80;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        client_max_body_size 50m;
    }

    location /openhim-api/ {
        set $openhim openhim-core;
        rewrite ^/openhim-api/(.*) /$1 break;
        proxy_pass http://$openhim:5001;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /dhis2-api/ {
        set $dhis2 dhis2-web;
        rewrite ^/dhis2-api/(.*) /$1 break;
        proxy_pass http://$dhis2:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
}
