  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading">
    <div class="boot">
      <svg class="boot-flag" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lesotho flag">
        <rect width="120" height="26.67" fill="#00209F"/>
        <rect y="26.67" width="120" height="26.66" fill="#ffffff"/>
        <rect y="53.33" width="120" height="26.67" fill="#009543"/>

              <!-- Tasks hidden for now (not needed) -->

              <a href="#/stock">Stock Log (LMIS)</a>
              <a href="#/openlmis">LMIS Live Data</a>
            </div>
          </div>
          <div class="nav-block system" onclick="location.hash='#/services'" style="cursor:pointer">

            <a href="#/services" style="display:none"></a>
          </div>
          <div class="nav-block system" onclick="location.hash='#/cluster'" style="cursor:pointer">
            <span class="nav-block-label">Backends &amp; Failover</span>
            <a href="#/cluster" style="display:none"></a>
          </div>
        </div>
        <ul>
          <li><small id="username"></small></li>
          <li><a href="#" id="logout-btn" role="button" class="outline contrast">Logout</a></li>
        </ul>
        <p class="sidebar-copyright">NEC XON &copy; Copyright 2025.</p>
      </nav>

    <button id="sidebar-reopen" onclick="toggleSidebar()" title="Open sidebar">▶</button>
    <main id="content"></main>

  <!-- Modal overlay -->
  <div id="modal" class="modal-overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <div id="modal-body"></div>

  <!-- Runtime env config (per-environment; overrides core.js localhost defaults) -->
  <script src="config.js"></script>
  <!-- Load the Keycloak adapter from the configured Keycloak URL (defaults to localhost) -->
  <script>
    (function () {
      var kcUrl = (window.__BKM_CONFIG__ && window.__BKM_CONFIG__.keycloakUrl) || 'http://localhost:8083';
      document.write('<scr' + 'ipt src="' + kcUrl + '/js/keycloak.js"></scr' + 'ipt>');
    })();
  </script>
