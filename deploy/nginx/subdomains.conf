# Host nginx — service subdomains (*.lesotho-bkm.xyz)
# Each proxies to its container's host-published port. mailhog + prometheus are
# behind HTTP Basic Auth (no native login). certbot --nginx adds TLS to all.
#
#   sudo cp deploy/nginx/subdomains.conf /etc/nginx/sites-available/subdomains
#   sudo ln -sf /etc/nginx/sites-available/subdomains /etc/nginx/sites-enabled/subdomains
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d opensrp.lesotho-bkm.xyz -d openhim.lesotho-bkm.xyz \
#     -d fhir.lesotho-bkm.xyz -d dhis2.lesotho-bkm.xyz -d lmis.lesotho-bkm.xyz \
#     -d grafana.lesotho-bkm.xyz -d prometheus.lesotho-bkm.xyz \
#     -d mailhog.lesotho-bkm.xyz -d sync.lesotho-bkm.xyz

server { listen 80; server_name opensrp.lesotho-bkm.xyz;
  location / { proxy_pass http://127.0.0.1:9901; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffer_size 128k; proxy_buffers 4 256k; } }

server { listen 80; server_name openhim.lesotho-bkm.xyz;
  location / { proxy_pass http://127.0.0.1:9285; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; } }

server { listen 80; server_name fhir.lesotho-bkm.xyz;
  location / { proxy_pass http://127.0.0.1:8079; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 50m; } }

server { listen 80; server_name dhis2.lesotho-bkm.xyz;
  location / { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffer_size 128k; proxy_buffers 4 256k; } }

server { listen 80; server_name lmis.lesotho-bkm.xyz;
  location / { proxy_pass http://127.0.0.1:8082; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffer_size 128k; proxy_buffers 4 256k; } }

server { listen 80; server_name grafana.lesotho-bkm.xyz;
  location / { proxy_pass http://127.0.0.1:3005; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; } }

server { listen 80; server_name sync.lesotho-bkm.xyz;
  location / { proxy_pass http://127.0.0.1:5001; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffer_size 128k; proxy_buffers 4 256k; client_max_body_size 50m; } }

# --- Basic-auth protected (no native login) ---
server { listen 80; server_name prometheus.lesotho-bkm.xyz;
  location / {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://127.0.0.1:9290; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme;
  } }

server { listen 80; server_name mailhog.lesotho-bkm.xyz;
  location / {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://127.0.0.1:8025; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
  } }
