# Host nginx — main domain (lesotho-bkm.xyz)
# Reverse-proxies bkm-web, Keycloak (/auth), and OpenHIM API (/openhim).
# Install: copy to /etc/nginx/sites-available/bkm, symlink into sites-enabled,
# then `certbot --nginx -d lesotho-bkm.xyz` adds the TLS 443 server block + redirect.
#
#   sudo cp deploy/nginx/bkm.conf /etc/nginx/sites-available/bkm
#   sudo ln -sf /etc/nginx/sites-available/bkm /etc/nginx/sites-enabled/bkm
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name lesotho-bkm.xyz;

    # bkm-web portal (default route)
    location / {
        proxy_pass http://127.0.0.1:9902;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak under /auth/  — NO trailing slash on proxy_pass so the /auth prefix is kept.
    # Large proxy buffers: Keycloak sends big headers (otherwise "upstream sent too big header").
    location /auth/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # OpenHIM Core API (self-signed upstream → terminate TLS here with the LE cert).
    location /openhim/ {
        proxy_pass https://127.0.0.1:8080/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
