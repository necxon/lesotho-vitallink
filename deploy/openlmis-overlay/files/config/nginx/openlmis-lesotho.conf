{{ $loaded_services := services }}
{{ $resources := tree (env "RESOURCES_PATH") }}

{{ $limitZoneSize := or (env "LIMIT_ZONE_SIZE") "32m" }}
{{ $limitRate := or (env "LIMIT_RATE") "20r/s" }}

# Fetch VIRTUAL_HOST environment variable to determine allowlisted IP
map $http_host $allowlisted_ip {
    default 1;  # Default to rate limit
    "{{ env "VIRTUAL_HOST" }}" 0;  # Allowlist the IP from VIRTUAL_HOST
    "~^localhost" 0;   # Browser: localhost or localhost:80 (port in Host header)
    "nginx" 0;          # Internal service-to-service calls
}

# Create a key based on whether the request should be limited
map $allowlisted_ip $limit_key {
    0 "";  # No rate limiting for allowlisted IP
    1 $binary_remote_addr;  # Rate limit other IPs
}

# Define the request rate limiting zone using the limit_key
limit_req_zone $limit_key zone=mylimit:{{ $limitZoneSize }} rate={{ $limitRate }};

{{ range $loaded_services }}
  {{- if in .Tags (env "SERVICE_TAG") -}}
  {{- $current_service := service .Name "any" -}}
  {{- if not (eq (len $current_service) 0) }}
  upstream {{ .Name }} {
    least_conn;
    keepalive 128;
    {{ range $current_service }}server {{ .Address }}:{{ .Port }};
    {{ end }}
  }
  {{ end -}}
  {{- end -}}
{{ end }}

log_format upstream_time '$remote_addr - $remote_user [$time_local] '
                 '"$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" '
                 '$request_time $upstream_connect_time '
                 '$upstream_header_time $upstream_response_time '
                 '$pipe $bytes_sent $request_length';

server {
  listen 80;
  gzip off;
  access_log {{ env "NGINX_LOG_DIR" }}/access.log upstream_time buffer=64k flush=30s;
  error_log {{ env "NGINX_LOG_DIR" }}/error.log;
  server_name {{ env "VIRTUAL_HOST" }};
  client_max_body_size {{ env "CLIENT_MAX_BODY_SIZE" }};
  proxy_connect_timeout {{ env "PROXY_CONNECT_TIMEOUT" }};
  proxy_send_timeout {{ env "PROXY_SEND_TIMEOUT" }};
  proxy_read_timeout {{ env "PROXY_READ_TIMEOUT" }};
  proxy_set_header Connection "";
  proxy_http_version 1.1;
  send_timeout {{ env "SEND_TIMEOUT" }};

  {{ $paramRegex := "{[\\w-]+}" }}
  {{ $allRegex := "<[\\w-]+>" }}
  {{ $globalAllRegex := "^<[\\w-]+>$" }}

  {{ $paramReplace := "[\\w-]+" }}
  {{ $allReplace := ".+" }}

  limit_req zone=mylimit burst=10 nodelay;
  limit_req_log_level warn;
  limit_req_status 429;

  # bkm-stubs-v2
  location = /api/users/35316636-6264-6331-2d34-3933322d3462/permissionStrings {
    default_type application/json;
    return 200 '["REQUISITION_CREATE|28de536f-b826-4eeb-a3c4-d65221a1120d|31ef5fd8-cef9-4ec0-8304-3018d2cf6c9c","REQUISITION_AUTHORIZE|28de536f-b826-4eeb-a3c4-d65221a1120d|31ef5fd8-cef9-4ec0-8304-3018d2cf6c9c","REQUISITION_APPROVE|28de536f-b826-4eeb-a3c4-d65221a1120d|31ef5fd8-cef9-4ec0-8304-3018d2cf6c9c","REQUISITION_VIEW|28de536f-b826-4eeb-a3c4-d65221a1120d|31ef5fd8-cef9-4ec0-8304-3018d2cf6c9c","REQUISITION_DELETE|28de536f-b826-4eeb-a3c4-d65221a1120d|31ef5fd8-cef9-4ec0-8304-3018d2cf6c9c","STOCK_INVENTORIES_EDIT|28de536f-b826-4eeb-a3c4-d65221a1120d|31ef5fd8-cef9-4ec0-8304-3018d2cf6c9c","STOCK_INVENTORIES_EDIT","STOCK_CARD_LINE_ITEM_REASONS_MANAGE","USER_ROLES_MANAGE","PROCESSING_SCHEDULES_MANAGE","PROGRAMS_MANAGE","STOCK_ORGANIZATIONS_MANAGE","STOCK_DESTINATIONS_MANAGE","USERS_MANAGE","STOCK_ADJUSTMENT_REASONS_MANAGE","REQUISITION_GROUPS_MANAGE","SUPERVISORY_NODES_MANAGE","SUPPLY_LINES_MANAGE","SYSTEM_IDEAL_STOCK_AMOUNTS_MANAGE","FACILITIES_MANAGE","RIGHTS_VIEW","GEOGRAPHIC_ZONES_MANAGE","REQUISITION_TEMPLATES_MANAGE","FACILITY_APPROVED_ORDERABLES_MANAGE","STOCK_CARD_TEMPLATES_MANAGE","SERVICE_ACCOUNTS_MANAGE","STOCK_SOURCES_MANAGE","ORDERABLES_MANAGE","SYSTEM_SETTINGS_MANAGE","CCE_MANAGE","STOCK_ADJUST|28de536f-b826-4eeb-a3c4-d65221a1120d|31ef5fd8-cef9-4ec0-8304-3018d2cf6c9c","STOCK_CARDS_VIEW|28de536f-b826-4eeb-a3c4-d65221a1120d|31ef5fd8-cef9-4ec0-8304-3018d2cf6c9c","STOCK_CARDS_VIEW"]';
  }
  location = /api/users/35316636-6264-6331-2d34-3933322d3462/programs {
    default_type application/json;
    return 200 '{"content":[{"code":"EM","name":"Essential Medicines","active":true,"periodsSkippable":false,"skipAuthorization":false,"showNonFullSupplyTab":true,"enableDatePhysicalStockCountCompleted":false,"id":"31ef5fd8-cef9-4ec0-8304-3018d2cf6c9c"}],"totalPages":1,"totalElements":1,"numberOfElements":1,"number":0,"size":2147483647,"first":true,"last":true}';
  }
  location ~ /api/userContactDetails {
    default_type application/json;
    return 200 '{"referenceDataUserId":"35316636-6264-6331-2d34-3933322d3462","emailDetails":{"email":"admin@example.com","emailVerified":false},"phoneNumber":"","allowNotify":true}';
  }
  location ~ /api/users/auth/[^/]+ {
    default_type application/json;
    return 200 '{"enabled":true,"loginRestricted":false,"allowedPrograms":[]}';
  }
  location = /api/users/me {
    rewrite ^ /api/users/35316636-6264-6331-2d34-3933322d3462 break;
    proxy_pass http://referencedata;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ /api/systemNotifications {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sysnot http://bkm-mediator:3000;
    rewrite ^/api/systemNotifications(.*)$ /lmis-notifications$1 break;
    proxy_pass $sysnot;
  }
  location ~ /oauth-init/openlmis {
    default_type application/json;
    return 200 '{"state":"NONE"}';
  }
  location ~ /oauth-authorized/openlmis {
    default_type application/json;
    return 200 '{"state":"NONE"}';
  }
  location ~ /api/pages/home {
    default_type application/json;
    return 200 '{"content":[],"totalElements":0,"totalPages":0,"last":true,"first":true,"number":0,"numberOfElements":0,"size":10}';
  }
  location ~ /api/supportedPrograms {
    default_type application/json;
    return 200 '[]';
  }
  location ~ /api/orders/statusesStatsData {
    default_type application/json;
    return 200 '{}';
  }
  location ~ /api/requisitions/statusesStatsData {
    default_type application/json;
    return 200 '{}';
  }
  location ~ /api/reports/dashboardReports {
    default_type application/json;
    return 200 '[]';
  }
  location = /api/orderables/search {
    proxy_method GET;
    rewrite ^ /api/orderables break;
    proxy_pass http://referencedata;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ /api/validSources {
    default_type application/json;
    return 200 '{"content":[],"totalElements":0,"totalPages":0,"last":true,"first":true,"number":0,"numberOfElements":0,"size":2147483647}';
  }
  location ~ /api/validDestinations {
    default_type application/json;
    return 200 '{"content":[],"totalElements":0,"totalPages":0,"last":true,"first":true,"number":0,"numberOfElements":0,"size":2147483647}';
  }
  location ~ /api/requisitionGroups {
    default_type application/json;
    set $rg "";
    if ($http_referer != "") { set $rg "B"; }
    if ($args != "") { set $rg "${rg}A"; }
    # Admin Requisition-Group list (browser + query params) reads response.content → needs a Page.
    # The approve/view flow + requisition service call WITHOUT params and do .filter/.map → need a bare array.
    if ($rg = "BA") {
      return 200 '{"content":[],"totalElements":0,"totalPages":0,"last":true,"first":true,"number":0,"numberOfElements":0,"size":2147483647}';
    }
    proxy_pass http://referencedata;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ /api/stockAdjustmentReasons {
    default_type application/json;
    return 200 '{"content":[],"totalElements":0,"totalPages":0,"last":true,"first":true,"number":0,"numberOfElements":0,"size":2147483647}';
  }
  location ~ /api/facilities/[^/]+/supportedPrograms {
    default_type application/json;
    return 200 '[{"programId":"31ef5fd8-cef9-4ec0-8304-3018d2cf6c9c","programName":"Essential Medicines","programCode":"EM","periodsSkippable":false,"skipAuthorization":false,"showNonFullSupplyTab":true,"supportStartDate":null,"locallyFulfilled":false}]';
  }
  location ~ /api/users/[^/]+/fulfillmentFacilities {
    default_type application/json;
    return 200 '[{"id":"28de536f-b826-4eeb-a3c4-d65221a1120d","name":"Maseru District Clinic A","code":"MC-A","active":true,"geographicZone":{"id":"d7b0f7a9-65c4-4e8f-bb8a-4b2a3b9c1d02","name":"Maseru"},"type":{"id":"facility-type-health-center","name":"Health Center"}}]';
  }
  location = /api/programs {
    default_type application/json;
    if ($arg_access) {
      return 200 '[{"id":"31ef5fd8-cef9-4ec0-8304-3018d2cf6c9c","name":"Essential Medicines","code":"EM","active":true,"periodsSkippable":false,"skipAuthorization":false,"showNonFullSupplyTab":true,"enableDatePhysicalStockCountCompleted":false}]';
    }
    proxy_pass http://referencedata;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ /localeSettings {
    default_type application/json;
    return 200 '{}';
  }
  location = /api/currencySettings {
    default_type application/json;
    return 200 '{"currencyCode":"LSL","currencySymbol":"M","currencySymbolSide":"left","currencyDecimalPlaces":2,"groupingSeparator":",","groupingSize":3,"decimalSeparator":"."}';
  }
  location ~ "^/\{\{" {
    return 200 '';
  }
  location = /login-fix.js {
    alias /etc/nginx/login-fix.js;
  }
  location = / {
    proxy_pass http://reference-ui;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding "";
    sub_filter '<head>' '<head><script>window.applicationCache=window.applicationCache||{addEventListener:function(){},removeEventListener:function(){},update:function(){},status:0,UNCACHED:0,IDLE:1,CHECKING:2,DOWNLOADING:3,UPDATEREADY:4,OBSOLETE:5};</script>';
    sub_filter_once on;
  }
  # First retrieve paths without parameters
  {{ range $resources }} {{ $location := .Key }} {{ $upstream := .Value }}
    {{- if not (or (regexMatch $paramRegex $location) (regexMatch $allRegex $location)) }}
      location ~ /{{ $location }}/?$  {
        {{- if eq (env "REQUIRE_SSL") "true" }}
          if ($http_x_forwarded_proto != "https") {
            return 307 https://$host$request_uri;
          }
        {{ end }}

        proxy_pass http://{{ $upstream }};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    {{ end -}}
  {{ end }}

  # Retrieve paths with {param} wildcard
  {{ range $resources }} {{ $location := .Key }} {{ $upstream := .Value }}
    {{- if regexMatch $paramRegex $location }}
      {{ $location := ($location | regexReplaceAll $paramRegex $paramReplace) }}
      location ~ /{{ $location }}/?$  {
        {{- if eq (env "REQUIRE_SSL") "true" }}
          if ($http_x_forwarded_proto != "https") {
            return 307 https://$host$request_uri;
          }
        {{ end }}

        proxy_pass http://{{ $upstream }};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    {{ end -}}
  {{ end }}

  # Retrieve paths with <all> wildcard, but without global wildcard
  {{ range $resources }} {{ $location := .Key }} {{ $upstream := .Value }}
    {{- if and (regexMatch $allRegex $location) (not (regexMatch $globalAllRegex $location)) }}
      {{ $location := ($location | regexReplaceAll $allRegex $allReplace) }}
      location ~ /{{ $location }}/?$  {
        {{- if eq (env "REQUIRE_SSL") "true" }}
          if ($http_x_forwarded_proto != "https") {
            return 307 https://$host$request_uri;
          }
        {{ end }}

        proxy_pass http://{{ $upstream }};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    {{ end -}}
  {{ end }}

  # Retrieve global <all> wildcard (if existent)
  {{ range $resources }} {{ $location := .Key }} {{ $upstream := .Value }}
    {{- if regexMatch $globalAllRegex $location }}
      location ~ /  {
        {{- if eq (env "REQUIRE_SSL") "true" }}
          if ($http_x_forwarded_proto != "https") {
            return 307 https://$host$request_uri;
          }
        {{ end }}

        proxy_pass http://{{ $upstream }};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location ~ /.+$  {
        {{- if eq (env "REQUIRE_SSL") "true" }}
          if ($http_x_forwarded_proto != "https") {
            return 307 https://$host$request_uri;
          }
        {{ end }}

        proxy_pass http://{{ $upstream }};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    {{ end -}}
  {{ end }}
}
