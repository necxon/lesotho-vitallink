# nginx on 192.0.2.61: the VHW preprod environment on amoh255bkmnec001 (192.0.2.132).
# Same routes as app.vhw.gov.ls / web.vhw.gov.ls (test), other names and ports.
#
#   sudo cp vhw-preprod.conf /etc/nginx/sites-available/vhw-preprod
#   sudo ln -s /etc/nginx/sites-available/vhw-preprod /etc/nginx/sites-enabled/vhw-preprod
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d preprod-app.vhw.gov.ls -d preprod-web.vhw.gov.ls -d preprod-builder.vhw.gov.ls -d preprod-grafana.vhw.gov.ls
#
# certbot then adds the HTTPS parts and the http -> https redirect itself.
# X-Forwarded-Proto comes from proxy_params; setting it again here sends it twice.

# preprod-app: app API (through the gateway) and logins (Keycloak)
server {
    listen 80;
    server_name preprod-app.vhw.gov.ls;
    client_max_body_size 50m;

    location / {
        proxy_pass http://192.0.2.132:18181;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
    }
    location /fhir {
        proxy_pass http://192.0.2.132:18181/fhir;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
    }
    location /auth {
        proxy_pass http://192.0.2.132:18182/auth;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }
}

# preprod-web: OpenSRP web portal
server {
    listen 80;
    server_name preprod-web.vhw.gov.ls;
    client_max_body_size 50m;

    location / {
        proxy_pass http://192.0.2.132:18300/;
        include /etc/nginx/proxy_params;
    }
    location /LocationHierarchy {
        proxy_pass http://192.0.2.132:18181/LocationHierarchy;
        include /etc/nginx/proxy_params;
    }
    location /fhir {
        proxy_pass http://192.0.2.132:18181/fhir;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
    }
    location /auth {
        proxy_pass http://192.0.2.132:18182/auth;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }
}

# preprod-builder: VitalLink web, form and phone-menu builder
server {
    listen 80;
    server_name preprod-builder.vhw.gov.ls;

    location / {
        proxy_pass http://192.0.2.132:18902/;
        include /etc/nginx/proxy_params;
    }
}

# preprod-grafana: Grafana (monitoring) from the VitalLink stack on the same host, port 3005
server {
    listen 80;
    server_name preprod-grafana.vhw.gov.ls;

    location / {
        proxy_pass http://192.0.2.132:3005;
        include /etc/nginx/proxy_params;
    }
    # live dashboards use a websocket
    location /api/live/ {
        proxy_pass http://192.0.2.132:3005;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
