# nginx inside the VitalLink web (bkm-web) container, preprod environment.
# Mounted over the image's default.conf by docker-compose.yml. The image's own
# file is written for the VitalLink dev stack: it names containers (Superset,
# OpenLMIS, DHIS2, mailhog, ...) that do not exist here, and nginx refuses to
# start when a fixed proxy_pass host cannot be resolved.
#
# Every upstream below is a variable, so it is resolved per request: a missing
# service gives a 502 for that call instead of stopping the whole portal.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /vendor/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Integration mediator (session seat, FHIR helpers). It runs in the older
    # VitalLink compose project on this host; until bkm-web is connected to its
    # network these calls return 502 and the portal carries on without them.
    location /mediator-api/ {
        set $mediator bkm-mediator;
        rewrite ^/mediator-api/(.*) /$1 break;
        proxy_pass http://$mediator:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /keycloak-api/ {
        set $kc keycloak;
        rewrite ^/keycloak-api/(.*) /$1 break;
        proxy_pass http://$kc:8080;
        proxy_set_header Host keycloak:8080;
        proxy_read_timeout 30s;
    }

    # Health probes for the Services page: only the services preprod has.
    location = /ping/keycloak/ {
        set $kc keycloak;
        proxy_pass http://$kc:8080/auth/realms/opensrp;
        proxy_connect_timeout 3s; proxy_read_timeout 5s;
    }
    location = /ping/fhir/ {
        set $gw gateway;
        proxy_pass http://$gw:8080/fhir/metadata;
        proxy_connect_timeout 3s; proxy_read_timeout 8s;
    }
    location = /ping/opensrp-web/ {
        set $web fhir-web;
        proxy_pass http://$web:3000/;
        proxy_connect_timeout 3s; proxy_read_timeout 5s;
    }
    location /ping/ { return 501; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
}
